[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatsvc"
version = "0.1.0"
description = "Small OpenAI chat service used as an ARCHON migration fixture."
requires-python = ">=3.10"
dependencies = [
    "openai>=2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["chatsvc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
