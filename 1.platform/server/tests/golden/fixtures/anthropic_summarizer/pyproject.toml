[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "summ"
version = "0.1.0"
description = "Anthropic Messages API summarizer used as an ARCHON migration fixture."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["summ*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
