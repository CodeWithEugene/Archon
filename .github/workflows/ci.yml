name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (ruff, mypy, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1.platform/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 1.platform/server/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: mypy app
      - run: pytest tests/unit -q -m "not slow"
      - name: Slow tests (real subprocesses, local backend)
        run: pytest tests/unit -q -m slow

  client:
    name: Client (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1.platform/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 1.platform/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_ARCHON_API: http://localhost:8000

  integration:
    name: Live integration (only when secrets exist)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: 1.platform/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/integration -q
        env:
          NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
          NEBIUS_PROJECT_ID: ${{ secrets.NEBIUS_PROJECT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
